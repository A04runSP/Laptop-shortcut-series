<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Laptop Shortcut Series — 30/30</title>
<style>
:root {
  --bg:#070b14; --panel:#0d1422; --panel2:#111a2a; --line:#1d2a3d;
  --text:#e8eef7; --muted:#8e9bad; --accent:#2aa7ff; --accent2:#67d5ff;
  --good:#43d6a1; --shadow:0 18px 60px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
button,input{font:inherit}
.app{min-height:100vh}
.topbar{position:sticky;top:0;z-index:20;display:flex;gap:14px;align-items:center;padding:14px 18px;background:rgba(7,11,20,.92);backdrop-filter:blur(16px);border-bottom:1px solid #142238}
.brand{font-weight:800;letter-spacing:.08em;font-size:14px;white-space:nowrap}
.brand span{color:var(--accent)}
.search{flex:1;max-width:620px;margin:auto}
.search input{width:100%;background:#0b1320;border:1px solid #20344e;color:var(--text);border-radius:14px;padding:12px 15px;outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(42,167,255,.12)}
.counter{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;white-space:nowrap}
.main{max-width:1180px;margin:0 auto;padding:26px 18px 110px}
.hero,.slide{min-height:calc(100vh - 105px);display:flex;flex-direction:column;justify-content:center}
.hero{text-align:center;align-items:center}
.kicker{display:inline-flex;gap:8px;align-items:center;border:1px solid #173451;background:#0b1728;color:#78cfff;border-radius:999px;padding:7px 12px;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
h1{font-size:clamp(38px,7vw,78px);line-height:.98;margin:22px 0 14px;letter-spacing:-.05em}
.hero h1{color:#2da9ff}
.lead{max-width:720px;color:var(--muted);font-size:clamp(15px,2vw,20px);line-height:1.6}
.pills{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px}
.pill{border:1px solid #1d3047;background:#0d1726;border-radius:999px;padding:7px 11px;color:#9db0c6;font-size:12px}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:20px}
.section-head h2{font-size:clamp(28px,5vw,48px);margin:0;letter-spacing:-.035em}
.section-head h2 span{color:var(--accent)}
.section-head p{color:var(--muted);max-width:560px;line-height:1.6;margin:0}
.meta{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px}
.progress{height:4px;background:#101c2c;border-radius:99px;overflow:hidden;margin:12px 0 24px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:linear-gradient(145deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:14px;padding:15px;transition:.2s;box-shadow:0 8px 25px rgba(0,0,0,.12)}
.card:hover{transform:translateY(-2px);border-color:#2a4767}
.card-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.card h3{font-size:15px;margin:0 0 5px}
.card p{margin:0;color:var(--muted);font-size:12px;line-height:1.5}
.keys{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end;max-width:46%}
.key{display:inline-block;padding:5px 8px;border-radius:7px;background:#172231;border:1px solid #2b3d54;box-shadow:inset 0 1px rgba(255,255,255,.04),0 2px 4px rgba(0,0,0,.3);color:#dce7f5;font-size:11px;white-space:nowrap}
.detail{margin-top:11px;padding-top:10px;border-top:1px solid #1b293b;color:#b7c4d4;font-size:12px;line-height:1.7;white-space:pre-line}
.detail b{color:#dce8f5}
.note{margin-top:20px;padding:16px 18px;border:1px solid #173b58;background:#0a1625;border-radius:14px;color:#a8b9cb;line-height:1.6;font-size:13px}
.nav{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:30;display:flex;gap:8px;align-items:center;padding:8px;background:rgba(4,8,14,.9);backdrop-filter:blur(18px);border:1px solid #20344c;border-radius:18px;box-shadow:var(--shadow)}
.nav button{border:1px solid #29415c;background:#0d1725;color:#dce8f5;border-radius:11px;padding:10px 14px;cursor:pointer}
.nav button:hover{border-color:var(--accent);color:#fff}
.nav .jump{min-width:72px;text-align:center;color:#9eb0c5;font-size:12px}
.toc{display:flex;gap:7px;flex-wrap:wrap;margin:18px 0 30px}
.toc button{background:#0b1421;color:#8fa4ba;border:1px solid #1a2a3d;border-radius:999px;padding:7px 10px;font-size:11px;cursor:pointer}
.toc button.active{color:#fff;border-color:var(--accent);background:#0b1c2e}
.hidden{display:none!important}
@media(max-width:760px){
 .topbar{padding:11px 12px} .brand{font-size:12px} .counter{display:none}
 .main{padding:18px 12px 100px} .grid{grid-template-columns:1fr}
 .hero,.slide{min-height:calc(100vh - 80px)}
 .section-head{display:block} .section-head p{margin-top:10px}
 .keys{max-width:50%} .nav{width:calc(100% - 24px);justify-content:space-between}
 .nav button{padding:9px 11px}
}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="brand">SHORTCUT <span>SERIES</span></div>
  <div class="search"><input id="search" placeholder="Search pages, shortcuts or actions…"></div>
  <div class="counter" id="counter">01 / 30</div>
</header>
<main class="main" id="main"></main>
<nav class="nav">
  <button onclick="go(-1)">← Previous</button>
  <div class="jump" id="jump">1 / 30</div>
  <button onclick="go(1)">Next →</button>
</nav>
</div>

const notes = {"1": "Use these as the foundation: they work across many Windows applications.", "2": "Windows-key shortcuts are especially useful when you want to keep your hands on the keyboard.", "3": "Window-management shortcuts reduce mouse movement and make multitasking much faster.", "4": "Most Chromium-style browsers share these navigation patterns.", "5": "Text-editing shortcuts are easiest to learn by practicing them while writing.", "6": "File Explorer shortcuts are designed around selecting, moving and inspecting files.", "7": "Troubleshooting shortcuts give direct access to system tools without hunting through menus.", "8": "Office shortcuts are often shared across multiple Microsoft Office applications.", "9": "Function-key behavior can vary by application, so treat the action as context-dependent where noted.", "10": "Capture shortcuts are useful for documentation, tutorials, support and quick sharing.", "11": "Advanced Windows shortcuts are best learned in small groups and practiced daily.", "12": "Chrome and Edge share many keyboard patterns, although some behavior can differ by browser version.", "13": "This page extends browser control into tabs, files, bookmarks and page navigation.", "14": "Accessibility shortcuts are built into Windows to make interaction easier and more comfortable.", "15": "Run commands are direct entry points into Windows tools; type commands exactly as shown.", "16": "These shortcuts target common VS Code/editor workflows such as navigation, debugging and code manipulation.", "17": "This is a compact daily-use set intended for repetition and muscle memory.", "18": "Excel shortcuts reward repetition because they reduce both navigation time and repetitive mouse work.", "19": "Word shortcuts focus on formatting, navigation and document structure.", "20": "PowerPoint shortcuts reduce design and presentation friction so attention stays on the message.", "21": "File-management shortcuts are about selection, movement, organization and inspection.", "22": "Taskbar shortcuts make frequently used apps accessible without reaching for the mouse.", "23": "Virtual desktops are useful for separating work, study, personal and entertainment contexts.", "24": "The supplied page groups quick access to Settings, Windows tools, display, accessibility and productivity controls.", "25": "Security shortcuts should be used deliberately; some commands can sign you out, delete data or change system behavior.", "26": "Power/performance shortcuts depend partly on Windows version and laptop hardware, especially Fn keys.", "27": "Many Windows tools can be reached through Win+R or the Windows quick-access menus.", "28": "VS Code shortcuts can vary with custom keybindings and extensions, but these are the patterns shown in the series.", "29": "Universal Office shortcuts provide a consistent mental model across common Microsoft Office apps.", "30": "Browser shortcuts are among the highest-value shortcuts to practice because browsing is repetitive."};
let current = 0;
let filtered = null;

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function keyHtml(keys) {
  return keys.split(/\s*\+\s*/).map(k=>`<span class="key">${escapeHtml(k)}</span>`).join('<span style="color:#4bbcff;padding:0 2px">+</span>');
}
function explanation(row, page) {
  const [keys, name, action] = row;

  const examples = {
    "Copy": "Select text or a file, press the shortcut, then paste it somewhere else to create a copy.",
    "Cut": "Select text or a file, cut it, open the destination, then paste it to move it.",
    "Paste": "Copy or cut content first, place the cursor or open the destination, then paste.",
    "Undo": "If you remove a paragraph by mistake, undo to restore the previous state.",
    "Redo": "After undoing a change, redo to apply that change again.",
    "Select All": "In a document, use the shortcut to select all text before changing its formatting.",
    "Save": "After editing a document, save it to keep the latest changes.",
    "Save As": "Save a copy with a new filename when you want to keep the original unchanged.",
    "Find / Search": "Search for a word in a long document to jump directly to its occurrence.",
    "Start Menu": "Open Start to search for an app such as Calculator.",
    "Show / Hide Desktop": "Reveal a file on the desktop, then use the shortcut again to return to your open windows.",
    "File Explorer": "Open a folder to browse files, create folders, or move items.",
    "Settings": "Open Settings to change Wi-Fi, display, Bluetooth, or personalization options.",
    "Lock Laptop": "Lock the computer before stepping away; sign in again to continue.",
    "Run": "Open Run, enter a known command such as notepad, then press Enter.",
    "Clipboard History": "Open clipboard history and select an earlier copied item to paste it.",
    "Screenshot": "Select the part of the screen you want to capture, then paste the image into a document.",
    "Developer Tools": "Open a website, launch developer tools, and inspect an element to see its HTML and CSS.",
    "Bookmark Manager": "Open the bookmark manager to find, organize, or delete saved pages.",
    "Clear Browsing Data": "Choose a time range and data types, then confirm only the items you intend to remove.",
    "Private Browsing Window": "Open a private window when you do not want that session's browsing history saved in the normal history.",
    "Bookmarks Bar": "Show the bookmarks bar to access saved websites without opening the bookmarks menu.",
    "New Tab": "Open another tab to keep a second website available without closing the current page.",
    "Close Tab": "Close the tab you have finished using while leaving the other tabs open.",
    "Next Tab": "Move to the next tab when several pages are open.",
    "Previous Tab": "Return to the tab immediately before the current one.",
    "Bookmark Page": "Save the current website as a bookmark so you can return to it later.",
    "Downloads": "Open downloads to find a file you just downloaded.",
    "Find on Page": "Search for a name or phrase on the current page instead of reading everything.",
    "Zoom In": "Increase the page size when text or controls are too small to read.",
    "Zoom Out": "Reduce page size to fit more content on the screen.",
    "Reset Zoom": "Return the page to its default zoom after changing its size.",
    "Homepage": "Open the home page configured in the browser settings.",
    "Go Back": "Return to the page you visited immediately before the current one.",
    "Go Forward": "After going back, move forward to the page you had been viewing.",
    "New Window": "Open a separate browser window to keep a different set of tabs apart.",
    "Print Page": "Open the print dialog to print the page or save it as a PDF.",
    "View Page Source": "Open the page source to inspect the HTML sent by the website.",
    "Bookmark All Tabs": "Save a group of open tabs into a bookmark folder where the browser supports it.",
    "Hard Refresh": "Reload a page when it appears to be showing stale cached content.",
    "Reload Page": "Reload the current page after a site has changed or failed to finish loading.",
    "Full Screen": "Use full screen to give the web page more screen space, then exit when finished."
  };

  let example = examples[name];
  if (!example) {
    const cleanAction = action.replace(/[.!]$/, "");
    example = "For example, while using the relevant app, press " + keys + " to " + cleanAction.charAt(0).toLowerCase() + cleanAction.slice(1) + ".";
  }

  return [
    "What it does: " + action,
    "Example: " + example
  ].join("\n");
}
function render(){
  const main = document.getElementById('main');
  if(filtered){
    main.innerHTML = `<section class="slide">
      <div class="section-head"><div><div class="kicker">Search results</div><h2>${filtered.length} matching <span>shortcuts</span></h2></div></div>
      <div class="grid">${filtered.map(x=>cardHtml(x.row,x.page)).join('')}</div>
    </section>`;
    return;
  }
  if(current===0){
    const p=pages[0];
    main.innerHTML = `<section class="hero">
      <div class="kicker">Ultimate Reference Guide</div>
      <h1>Laptop Shortcut Series</h1>
      <div class="lead">A living, searchable 30-page keyboard reference built from the supplied Shortcut Series source. Learn the key, the command, what it does, and when to use it.</div>
      <div class="pills"><span class="pill">Windows 10 / 11</span><span class="pill">Productivity</span><span class="pill">Browser</span><span class="pill">Office</span><span class="pill">Coding</span></div>
      <div class="note"><b>How to use it:</b> press <b>← / →</b> or the buttons below to move between pages. Use the search box to find a shortcut across the entire 30-page guide.</div>
    </section>`;
  } else {
    const p=pages[current];
    main.innerHTML = `<section class="slide">
      <div class="section-head">
        <div><div class="kicker">Page ${String(p.n).padStart(2,'0')} / 30</div><h2>${escapeHtml(p.title.split(' ')[0])} <span>${escapeHtml(p.title.split(' ').slice(1).join(' '))}</span></h2></div>
        <div class="meta">${p.rows.length} shortcuts</div>
      </div>
      <p class="lead">${escapeHtml(p.subtitle)}</p>
      <div class="progress"><i style="width:${p.n/30*100}%"></i></div>
      <div class="grid">${p.rows.map(r=>cardHtml(r,p)).join('')}</div>
      <div class="note"><b>Page focus:</b> ${escapeHtml(notes[p.n] || '')}</div>
    </section>`;
  }
  document.getElementById('counter').textContent = String(current+1).padStart(2,'0') + ' / 30';
  document.getElementById('jump').textContent = (current+1)+' / 30';
  window.scrollTo({top:0,behavior:'smooth'});
}
function cardHtml(row,page){
  const [keys,name,action]=row;
  return `<article class="card">
    <div class="card-top">
      <div><h3>${escapeHtml(name)}</h3><p>${escapeHtml(action)}</p></div>
      <div class="keys">${keyHtml(keys)}</div>
    </div>
    <div class="detail"><b>Detailed explanation:</b> ${escapeHtml(explanation(row,page))}</div>
  </article>`;
}
function go(delta){
  filtered=null;
  current=Math.max(0,Math.min(pages.length-1,current+delta));
  document.getElementById('search').value='';
  render();
}
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT') return;
  if(e.key==='ArrowRight') go(1);
  if(e.key==='ArrowLeft') go(-1);
  if(e.key==='Home'){current=0;render();}
  if(e.key==='End'){current=pages.length-1;render();}
});
document.getElementById('search').addEventListener('input',e=>{
  const q=e.target.value.trim().toLowerCase();
  if(!q){filtered=null;render();return;}
  filtered=[];
  pages.forEach(p=>p.rows.forEach(row=>{
    const hay=(p.title+' '+row.join(' ')).toLowerCase();
    if(hay.includes(q)) filtered.push({row,page:p});
  }));
  render();
});
render();
</script>
