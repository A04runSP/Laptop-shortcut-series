<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Laptop Shortcut Series — 9 Categories</title>
<style>
:root {
  --bg:#090909; --panel:#141010; --panel2:#1b1114; --line:#382027;
  --text:#f5eeee; --muted:#b39da2; --accent:#e63950; --accent2:#ff7184;
  --good:#ff7184; --shadow:0 18px 60px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
button,input{font:inherit}
.app{min-height:100vh}
.topbar{position:sticky;top:0;z-index:20;display:flex;gap:14px;align-items:center;padding:14px 18px;background:rgba(9,9,9,.94);backdrop-filter:blur(16px);border-bottom:1px solid #382027}
.brand{font-weight:800;letter-spacing:.08em;font-size:14px;white-space:nowrap}
.brand span{color:var(--accent)}
.search{flex:1;max-width:620px;margin:auto}
.search input{width:100%;background:#130f10;border:1px solid #382027;color:var(--text);border-radius:14px;padding:12px 15px;outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(230,57,80,.16)}
.counter{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;white-space:nowrap}
.practice-toggle,.study-button{border:1px solid #6b2634;background:#281016;color:#ffe8eb;border-radius:11px;padding:10px 13px;cursor:pointer;font-weight:650}
.practice-toggle:hover,.study-button:hover{border-color:var(--accent);background:#3b111b}
.study-wrap{max-width:760px;margin:24px auto;background:linear-gradient(145deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:18px;padding:clamp(18px,4vw,30px)}
.study-options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.study-options button{min-height:48px;text-align:left;white-space:normal}
.study-options button.correct{border-color:#22c55e;background:#12351f;color:#dcfce7;box-shadow:0 0 0 1px rgba(34,197,94,.22)}
.study-options button.wrong{border-color:#a77b83;background:#281a1e}
.study-status{color:var(--muted);font-size:13px;margin:12px 0}
.study-key{font-size:clamp(25px,5vw,42px);font-weight:800;color:var(--accent);margin:16px 0}
.study-answer-form{display:flex;gap:10px;align-items:stretch;margin:18px 0 10px}
.study-answer-input{flex:1;min-width:0;background:#100c0d;border:1px solid #75404b;border-radius:11px;padding:13px 14px;color:var(--text);outline:none}
.study-answer-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(230,57,80,.18)}
.study-answer-feedback{min-height:24px;margin:8px 0;color:var(--muted);font-size:14px}
.study-answer-feedback.good{color:#4ade80;font-weight:750}
.study-button.answer-correct{border-color:#22c55e;background:#12351f;color:#dcfce7;box-shadow:0 0 0 1px rgba(34,197,94,.22)}
@media(max-width:480px){.study-answer-form{flex-direction:column}.study-answer-form .study-button{width:100%}}
@media(max-width:480px){.topbar{gap:8px}.brand{font-size:10px}.practice-toggle{padding:9px 10px;font-size:12px}.search input{padding:10px}.study-options{grid-template-columns:1fr}}
.main{max-width:1180px;margin:0 auto;padding:26px 18px 110px}
.hero,.slide{min-height:calc(100vh - 105px);display:flex;flex-direction:column;justify-content:center}
.hero{text-align:center;align-items:center}
.kicker{display:inline-flex;gap:8px;align-items:center;border:1px solid #542431;background:#1a1013;color:#ff9aa8;border-radius:999px;padding:7px 12px;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
h1{font-size:clamp(38px,7vw,78px);line-height:.98;margin:22px 0 14px;letter-spacing:-.05em}
.hero h1{color:#ff4058}
.lead{max-width:720px;color:var(--muted);font-size:clamp(15px,2vw,20px);line-height:1.6}
.pills{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px}
.pill{border:1px solid #382027;background:#171012;border-radius:999px;padding:7px 11px;color:#c7aeb3;font-size:12px}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:20px}
.section-head h2{font-size:clamp(28px,5vw,48px);margin:0;letter-spacing:-.035em}
.section-head h2 span{color:var(--accent)}
.section-head p{color:var(--muted);max-width:560px;line-height:1.6;margin:0}
.meta{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px}
.progress{height:4px;background:#24171a;border-radius:99px;overflow:hidden;margin:12px 0 24px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:linear-gradient(145deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:14px;padding:15px;transition:.2s;box-shadow:0 8px 25px rgba(0,0,0,.12)}
.card:hover{transform:translateY(-2px);border-color:#8e2c3d}
.card-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.card h3{font-size:15px;margin:0 0 5px}
.card p{margin:0;color:var(--muted);font-size:12px;line-height:1.5}
.keys{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end;max-width:46%}
.key{display:inline-block;padding:5px 8px;border-radius:7px;background:#27171b;border:1px solid #59303a;box-shadow:inset 0 1px rgba(255,255,255,.04),0 2px 4px rgba(0,0,0,.3);color:#dce7f5;font-size:11px;white-space:nowrap}
.detail{margin-top:11px;padding-top:10px;border-top:1px solid #382027;color:#b7c4d4;font-size:12px;line-height:1.7;white-space:pre-line}
.detail b{color:#dce8f5}
.note{margin-top:20px;padding:16px 18px;border:1px solid #542431;background:#171012;border-radius:14px;color:#a8b9cb;line-height:1.6;font-size:13px}
.nav{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:30;display:flex;gap:8px;align-items:center;padding:8px;background:rgba(4,8,14,.9);backdrop-filter:blur(18px);border:1px solid #542431;border-radius:18px;box-shadow:var(--shadow)}
.nav button{border:1px solid #542431;background:#171012;color:#dce8f5;border-radius:11px;padding:10px 14px;cursor:pointer}
.nav button:hover{border-color:var(--accent);color:#fff}
.nav .jump{min-width:72px;text-align:center;color:#9eb0c5;font-size:12px}
.category-nav{max-width:1180px;margin:0 auto;padding:10px 18px 0}
.toc{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 8px}
.toc button{background:#171012;color:#c7aeb3;border:1px solid #382027;border-radius:999px;padding:8px 11px;font-size:11px;cursor:pointer;transition:background .15s,border-color .15s}
.toc button:hover,.toc button:focus-visible{border-color:var(--accent);color:#fff;outline:none}
.toc button.active{color:#fff;border-color:var(--accent);background:#30121a}
.mobile-category{display:none;width:100%;background:#171012;color:var(--text);border:1px solid #542431;border-radius:12px;padding:12px;font:inherit}
@media(max-width:760px){
 .category-nav{padding:10px 12px 0}
 .toc{display:none}
 .mobile-category{display:block}
}
.hidden{display:none!important}
@media(max-width:760px){
 .topbar{padding:11px 12px} .brand{font-size:12px} .counter{display:none}
 .main{padding:18px 12px 100px} .grid{grid-template-columns:1fr}
 .hero,.slide{min-height:calc(100vh - 80px)}
 .section-head{display:block} .section-head p{margin-top:10px}
 .keys{max-width:50%} .nav{width:calc(100% - 24px);justify-content:space-between}
 .nav button{padding:9px 11px}
}
</style>

const STUDY_KEY = "laptop-shortcut-series-study-v1";
function getStudyStats(){try{return JSON.parse(localStorage.getItem(STUDY_KEY))||{known:[],review:[],quizzes:0,best:0};}catch(e){return {known:[],review:[],quizzes:0,best:0};}}
function saveStudyStats(stats){try{localStorage.setItem(STUDY_KEY,JSON.stringify(stats));}catch(e){}}
function allStudyRows(){return pages.flatMap(p=>p.rows.filter(row=>row.length===3 && !/menu path|manufacturer-specific|how to use|version differences|hardware differences|defaults and customizations/i.test(row[1])).map(row=>({row,page:p})));}
function toggleLearning(){if(learningMode){closeLearning();return;}openLearning();}
function openLearning(){learningMode=true;filtered=null;document.getElementById("search").value="";document.getElementById("categoryNav").classList.add("hidden");document.querySelector(".nav").classList.add("hidden");renderLearning();}
function closeLearning(){learningMode=false;document.getElementById("categoryNav").classList.remove("hidden");document.querySelector(".nav").classList.remove("hidden");render();}
function startFlashcards(){studyMode="flashcards";const rows=allStudyRows();studyDeck=rows.sort(()=>Math.random()-.5).slice(0,20);studyIndex=0;revealed=false;flashcardAnswer="";flashcardFeedback="";flashcardCorrect=false;renderLearning();}
function startQuiz(){studyMode="quiz";const rows=allStudyRows();studyDeck=rows.sort(()=>Math.random()-.5).slice(0,10);quizIndex=0;quizScore=0;quizAnswered=false;quizChoice=-1;renderLearning();}
function checkFlashcardAnswer(event){if(event)event.preventDefault();if(!studyDeck.length)return;const input=document.getElementById("flashcardAnswer");const raw=input?input.value:flashcardAnswer;flashcardAnswer=String(raw||"");const normalize=s=>String(s||"").toLowerCase().replace(/[＋]/g,"+").replace(/\s+/g,"").replace(/key/g,"");const expected=normalize(studyDeck[studyIndex].row[0]);const entered=normalize(flashcardAnswer);if(!entered){flashcardFeedback="Enter a shortcut first, then try again.";flashcardCorrect=false;revealed=false;}else if(entered===expected){flashcardFeedback="Correct! Your answer is right.";flashcardCorrect=true;revealed=true;}else{flashcardFeedback="Wrong answer — try again.";flashcardCorrect=false;revealed=false;}renderLearning();if(!flashcardCorrect){const nextInput=document.getElementById("flashcardAnswer");if(nextInput){nextInput.focus();nextInput.setSelectionRange(nextInput.value.length,nextInput.value.length);}}}
function advanceFlashcard(){studyIndex++;revealed=false;flashcardAnswer="";flashcardFeedback="";flashcardCorrect=false;if(studyIndex>=studyDeck.length){studyDeck=[];renderLearning(true);}else renderLearning();}
function markFlashcard(known){const stats=getStudyStats();const key=studyDeck[studyIndex].row[0]+"|"+studyDeck[studyIndex].row[1];stats.known=stats.known.filter(x=>x!==key);stats.review=stats.review.filter(x=>x!==key);(known?stats.known:stats.review).push(key);saveStudyStats(stats);advanceFlashcard();}
function chooseQuiz(i){if(quizAnswered)return;quizChoice=i;quizAnswered=true;if(studyDeck[quizIndex].row[0]===studyDeck[quizIndex].options[i])quizScore++;renderLearning();}
function nextQuiz(){quizIndex++;quizAnswered=false;quizChoice=-1;if(quizIndex>=studyDeck.length){const stats=getStudyStats();stats.quizzes=(stats.quizzes||0)+1;stats.best=Math.max(stats.best||0,quizScore);saveStudyStats(stats);studyDeck=[];renderLearning(true);}else renderLearning();}
function renderLearning(done=false){const main=document.getElementById("main");const stats=getStudyStats();document.getElementById("practiceToggle").textContent="Learning mode";document.getElementById("counter").textContent="STUDY";document.getElementById("jump").textContent="Study";
if(done){main.innerHTML=`<section class="study-wrap"><div class="kicker">Session complete</div><h2>${studyMode==="quiz"?"Quiz finished":"Flashcards finished"}</h2><p class="lead">${studyMode==="quiz"?`You scored ${quizScore} out of 10.`:"You reviewed 20 cards and marked each for recall."}</p><div class="note">Saved on this device: <b>${stats.known.length}</b> marked known · <b>${stats.review.length}</b> to review · <b>${stats.quizzes||0}</b> quizzes completed · best score <b>${stats.best||0}/10</b>.</div><div class="pills"><button class="study-button" onclick="startFlashcards()">Practise again</button><button class="study-button" onclick="startQuiz()">Take a quiz</button><button class="study-button" onclick="closeLearning()">Back to shortcuts</button></div></section>`;return;}
if(!studyDeck.length){main.innerHTML=`<section class="study-wrap"><div class="kicker">Active recall</div><h2>Learn shortcuts by practising</h2><p class="lead">Use flashcards to recall the key combination, then take a 10-question quiz. Your study counts are saved only in this browser on this device.</p><div class="note"><b>Your progress:</b> ${stats.known.length} known · ${stats.review.length} to review · ${stats.quizzes||0} quizzes · best ${stats.best||0}/10</div><div class="pills"><button class="study-button" onclick="startFlashcards()">Start 20 flashcards</button><button class="study-button" onclick="startQuiz()">Start 10-question quiz</button><button class="study-button" onclick="closeLearning()">Back to shortcuts</button></div></section>`;return;}
if(studyMode==="flashcards"){const item=studyDeck[studyIndex];main.innerHTML=`<section class="study-wrap"><div class="kicker">Flashcards · ${studyIndex+1} / ${studyDeck.length}</div><div class="progress"><i style="width:${studyIndex/studyDeck.length*100}%"></i></div><h2>Type the shortcut for this action</h2><p class="lead">${escapeHtml(item.row[1])}</p><p>${escapeHtml(item.row[2])}</p><form class="study-answer-form" onsubmit="checkFlashcardAnswer(event)"><input id="flashcardAnswer" class="study-answer-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Your keyboard shortcut answer" placeholder="Type your answer, e.g. Ctrl + C" value="${escapeHtml(flashcardAnswer)}" oninput="flashcardAnswer=this.value" onchange="flashcardAnswer=this.value"><button class="study-button ${flashcardCorrect?"answer-correct":""}" type="submit">${flashcardCorrect?"Correct ✓":"Check answer"}</button></form><div class="study-answer-feedback ${flashcardCorrect?"good":""}" role="status" aria-live="polite">${escapeHtml(flashcardFeedback)}</div>${revealed?`<div class="study-key">${escapeHtml(item.row[0])}</div><div class="note">Category: ${escapeHtml(item.page.title)}</div><div class="pills"><button class="study-button" onclick="markFlashcard(true)">I knew it</button><button class="study-button" onclick="markFlashcard(false)">Review again</button><button class="study-button" onclick="advanceFlashcard()">Next card →</button></div>`:`<button class="study-button" type="button" onclick="revealed=true;renderLearning()">Reveal shortcut</button>`}<div class="study-status">Saved progress: ${stats.known.length} known · ${stats.review.length} to review</div><button class="study-button" onclick="closeLearning()">Exit practice</button></section>`;return;}
const item=studyDeck[quizIndex];if(!item.options){const pool=allStudyRows().filter(x=>x.row[0]!==item.row[0]);const opts=[item.row[0]];while(opts.length<4&&pool.length){const n=Math.floor(Math.random()*pool.length);const v=pool.splice(n,1)[0].row[0];if(!opts.includes(v))opts.push(v);}item.options=opts.sort(()=>Math.random()-.5);}
main.innerHTML=`<section class="study-wrap"><div class="kicker">Shortcut quiz · ${quizIndex+1} / ${studyDeck.length}</div><div class="progress"><i style="width:${quizIndex/studyDeck.length*100}%"></i></div><h2>Choose the correct shortcut</h2><p class="lead">${escapeHtml(item.row[1])}</p><p>${escapeHtml(item.row[2])}</p><div class="study-options">${item.options.map((opt,i)=>`<button class="study-button ${quizAnswered&&opt===item.row[0]?"correct":quizAnswered&&i===quizChoice?"wrong":""}" ${quizAnswered?"disabled":""} onclick="chooseQuiz(${i})">${escapeHtml(opt)}</button>`).join("")}</div>${quizAnswered?`<div class="note" role="status">${item.options[quizChoice]===item.row[0]?"Correct.":"Not quite."} Correct answer: <b>${escapeHtml(item.row[0])}</b></div><button class="study-button" onclick="nextQuiz()">${quizIndex===studyDeck.length-1?"Finish quiz":"Next question"}</button>`:""}<div class="study-status">Score: ${quizScore} · Progress saved after completing the quiz</div><button class="study-button" onclick="closeLearning()">Exit practice</button></section>`;}


function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function keyHtml(keys) {
  return keys.split(/\s*\+\s*/).map(k=>`<span class="key">${escapeHtml(k)}</span>`).join('<span style="color:#ff6579;padding:0 2px">+</span>');
}
function explanation(row, page) {
  const [keys, name, action] = row;

  const examples = {
    "Copy": "Select text or a file, press the shortcut, then paste it somewhere else to create a copy.",
    "Cut": "Select text or a file, cut it, open the destination, then paste it to move it.",
    "Paste": "Copy or cut content first, place the cursor or open the destination, then paste.",
    "Undo": "If you remove a paragraph by mistake, undo to restore the previous state.",
    "Redo": "After undoing a change, redo to apply that change again.",
    "Select All": "In a document, use the shortcut to select all text before changing its formatting.",
    "Save": "After editing a document, save it to keep the latest changes.",
    "Save As": "Save a copy with a new filename when you want to keep the original unchanged.",
    "Find / Search": "Search for a word in a long document to jump directly to its occurrence.",
    "Start Menu": "Open Start to search for an app such as Calculator.",
    "Show / Hide Desktop": "Reveal a file on the desktop, then use the shortcut again to return to your open windows.",
    "File Explorer": "Open a folder to browse files, create folders, or move items.",
    "Settings": "Open Settings to change Wi-Fi, display, Bluetooth, or personalization options.",
    "Lock Laptop": "Lock the computer before stepping away; sign in again to continue.",
    "Run": "Open Run, enter a known command such as notepad, then press Enter.",
    "Clipboard History": "Open clipboard history and select an earlier copied item to paste it.",
    "Screenshot": "Select the part of the screen you want to capture, then paste the image into a document.",
    "Developer Tools": "Open a website, launch developer tools, and inspect an element to see its HTML and CSS.",
    "Bookmark Manager": "Open the bookmark manager to find, organize, or delete saved pages.",
    "Clear Browsing Data": "Choose a time range and data types, then confirm only the items you intend to remove.",
    "Private Browsing Window": "Open a private window when you do not want that session's browsing history saved in the normal history.",
    "Bookmarks Bar": "Show the bookmarks bar to access saved websites without opening the bookmarks menu.",
    "New Tab": "Open another tab to keep a second website available without closing the current page.",
    "Close Tab": "Close the tab you have finished using while leaving the other tabs open.",
    "Next Tab": "Move to the next tab when several pages are open.",
    "Previous Tab": "Return to the tab immediately before the current one.",
    "Bookmark Page": "Save the current website as a bookmark so you can return to it later.",
    "Downloads": "Open downloads to find a file you just downloaded.",
    "Find on Page": "Search for a name or phrase on the current page instead of reading everything.",
    "Zoom In": "Increase the page size when text or controls are too small to read.",
    "Zoom Out": "Reduce page size to fit more content on the screen.",
    "Reset Zoom": "Return the page to its default zoom after changing its size.",
    "Homepage": "Open the home page configured in the browser settings.",
    "Go Back": "Return to the page you visited immediately before the current one.",
    "Go Forward": "After going back, move forward to the page you had been viewing.",
    "New Window": "Open a separate browser window to keep a different set of tabs apart.",
    "Print Page": "Open the print dialog to print the page or save it as a PDF.",
    "View Page Source": "Open the page source to inspect the HTML sent by the website.",
    "Bookmark All Tabs": "Save a group of open tabs into a bookmark folder where the browser supports it.",
    "Hard Refresh": "Reload a page when it appears to be showing stale cached content.",
    "Reload Page": "Reload the current page after a site has changed or failed to finish loading.",
    "Full Screen": "Use full screen to give the web page more screen space, then exit when finished."
  };

  let example = examples[name];
  if (!example) {
    const cleanAction = action.replace(/[.!]$/, "");
    example = "For example, while using the relevant app, press " + keys + " to " + cleanAction.charAt(0).toLowerCase() + cleanAction.slice(1) + ".";
  }

  return [
    "What it does: " + action,
    "Example: " + example
  ].join("\n");
}
function renderCategoryNav(){
  const toc=document.getElementById('toc');
  const select=document.getElementById('mobileCategory');
  toc.innerHTML=pages.map(p=>`<button type="button" class="${current===p.n&&!filtered?'active':''}" aria-current="${current===p.n&&!filtered?'page':'false'}" onclick="goToCategory(${p.n})">${escapeHtml(p.title)}</button>`).join('');
  select.innerHTML='<option value="0">Choose a category…</option>'+pages.map(p=>`<option value="${p.n}" ${current===p.n&&!filtered?'selected':''}>${escapeHtml(p.title)}</option>`).join('');
}
function goToCategory(pageNumber){
  if(learningMode) closeLearning();
  filtered=null;
  current=pageNumber;
  document.getElementById('search').value='';
  render();
}
document.getElementById('mobileCategory').addEventListener('change',e=>{
  if(Number(e.target.value)>0) goToCategory(Number(e.target.value));
});
function render(){
  if(learningMode){renderLearning();return;}
  document.getElementById("practiceToggle").textContent="Practice";
  document.getElementById("counter").textContent = String(current).padStart(2,"0") + " / " + String(pages.length).padStart(2,"0");
  document.getElementById("jump").textContent = current+" / "+pages.length;
  renderCategoryNav();
  const main = document.getElementById('main');
  if(filtered !== null){
    main.innerHTML = `<section class="slide">
      <div class="section-head"><div><div class="kicker">Search results</div><h2>${filtered.length} matching <span>shortcuts</span></h2></div></div>
      ${filtered.length ? `<div class="grid">${filtered.map(x=>cardHtml(x.row,x.page)).join('')}</div>` : `<div class="note" role="status">No matching shortcuts found. Try a different keyword or key combination.</div>`}
    </section>`;
    document.getElementById("counter").textContent = filtered.length + " found";
    document.getElementById("jump").textContent = "Search";
    return;
  }
  if(current===0){
    const p=pages[0];
    main.innerHTML = `<section class="hero">
      <div class="kicker">Ultimate Reference Guide</div>
      <h1>Laptop Shortcut Series</h1>
      <div class="lead">A searchable keyboard reference organized into 9 practical categories. Learn the key, the command, what it does, and when to use it.</div>
      <div class="pills"><span class="pill">Windows 10 / 11</span><span class="pill">Productivity</span><span class="pill">Browser</span><span class="pill">Office</span><span class="pill">Coding</span></div>
      <div class="note"><b>How to use it:</b> choose a category from the navigation above, or use <b>← / →</b> and the Previous / Next buttons below. Search finds shortcuts across the entire guide.</div>
    </section>`;
  } else {
    const p=pages[current-1];
    main.innerHTML = `<section class="slide">
      <div class="section-head">
        <div><div class="kicker">Category ${String(p.n).padStart(2,'0')} / ${pages.length}</div><h2>${escapeHtml(p.title.split(' ')[0])} <span>${escapeHtml(p.title.split(' ').slice(1).join(' '))}</span></h2></div>
        <div class="meta">${p.rows.length} shortcuts</div>
      </div>
      <p class="lead">${escapeHtml(p.subtitle)}</p>
      <div class="progress"><i style="width:${p.n/pages.length*100}%"></i></div>
      <div class="grid">${p.rows.map(r=>cardHtml(r,p)).join('')}</div>
      <div class="note"><b>Page focus:</b> ${escapeHtml(notes[p.n] || '')}</div>
    </section>`;
  }
  document.getElementById('counter').textContent = String(current).padStart(2,'0') + ' / ' + String(pages.length).padStart(2,'0');
  document.getElementById('jump').textContent = current+' / '+pages.length;
  window.scrollTo({top:0,behavior:'smooth'});
}
function cardHtml(row,page){
  const [keys,name,action]=row;
  return `<article class="card">
    <div class="card-top">
      <div><h3>${escapeHtml(name)}</h3><p>${escapeHtml(action)}</p></div>
      <div class="keys">${keyHtml(keys)}</div>
    </div>
    <div class="detail"><b>Detailed explanation:</b> ${escapeHtml(explanation(row,page))}</div>
  </article>`;
}
function go(delta){
  if(learningMode) closeLearning();
  filtered=null;
  current=Math.max(0,Math.min(pages.length,current+delta));
  document.getElementById('search').value='';
  render();
}
document.addEventListener('keydown',e=>{
  const target=e.target;
  const tag=target && target.tagName ? target.tagName : '';
  const isTyping=target && (target.isContentEditable || ['INPUT','TEXTAREA','SELECT'].includes(tag));
  if(isTyping || learningMode || e.altKey || e.ctrlKey || e.metaKey) return;
  if(e.key==='ArrowRight'){
    e.preventDefault();
    go(1);
  }else if(e.key==='ArrowLeft'){
    e.preventDefault();
    go(-1);
  }else if(e.key==='Home'){
    e.preventDefault();
    if(learningMode) return;
    filtered=null;
    current=0;
    document.getElementById('search').value='';
    render();
  }else if(e.key==='End'){
    e.preventDefault();
    if(learningMode) return;
    filtered=null;
    current=pages.length;
    document.getElementById('search').value='';
    render();
  }
});
document.getElementById('search').addEventListener('input',e=>{
  if(learningMode) closeLearning();
  const q=e.target.value.trim().toLowerCase();
  if(!q){filtered=null;render();return;}
  filtered=[];
  pages.forEach(p=>p.rows.forEach(row=>{
    const hay=(p.title+' '+row.join(' ')).toLowerCase();
    if(hay.includes(q)) filtered.push({row,page:p});
  }));
  render();
});
render();
</script>
