<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Laptop Shortcut Series — 9 Categories</title>
<style>
:root {
  --bg:#070b14; --panel:#0d1422; --panel2:#111a2a; --line:#1d2a3d;
  --text:#e8eef7; --muted:#8e9bad; --accent:#2aa7ff; --accent2:#67d5ff;
  --good:#43d6a1; --shadow:0 18px 60px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
button,input{font:inherit}
.app{min-height:100vh}
.topbar{position:sticky;top:0;z-index:20;display:flex;gap:14px;align-items:center;padding:14px 18px;background:rgba(7,11,20,.92);backdrop-filter:blur(16px);border-bottom:1px solid #142238}
.brand{font-weight:800;letter-spacing:.08em;font-size:14px;white-space:nowrap}
.brand span{color:var(--accent)}
.search{flex:1;max-width:620px;margin:auto}
.search input{width:100%;background:#0b1320;border:1px solid #20344e;color:var(--text);border-radius:14px;padding:12px 15px;outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(42,167,255,.12)}
.counter{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;white-space:nowrap}
.main{max-width:1180px;margin:0 auto;padding:26px 18px 110px}
.hero,.slide{min-height:calc(100vh - 105px);display:flex;flex-direction:column;justify-content:center}
.hero{text-align:center;align-items:center}
.kicker{display:inline-flex;gap:8px;align-items:center;border:1px solid #173451;background:#0b1728;color:#78cfff;border-radius:999px;padding:7px 12px;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
h1{font-size:clamp(38px,7vw,78px);line-height:.98;margin:22px 0 14px;letter-spacing:-.05em}
.hero h1{color:#2da9ff}
.lead{max-width:720px;color:var(--muted);font-size:clamp(15px,2vw,20px);line-height:1.6}
.pills{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px}
.pill{border:1px solid #1d3047;background:#0d1726;border-radius:999px;padding:7px 11px;color:#9db0c6;font-size:12px}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:20px}
.section-head h2{font-size:clamp(28px,5vw,48px);margin:0;letter-spacing:-.035em}
.section-head h2 span{color:var(--accent)}
.section-head p{color:var(--muted);max-width:560px;line-height:1.6;margin:0}
.meta{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px}
.progress{height:4px;background:#101c2c;border-radius:99px;overflow:hidden;margin:12px 0 24px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:linear-gradient(145deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:14px;padding:15px;transition:.2s;box-shadow:0 8px 25px rgba(0,0,0,.12)}
.card:hover{transform:translateY(-2px);border-color:#2a4767}
.card-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.card h3{font-size:15px;margin:0 0 5px}
.card p{margin:0;color:var(--muted);font-size:12px;line-height:1.5}
.keys{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end;max-width:46%}
.key{display:inline-block;padding:5px 8px;border-radius:7px;background:#172231;border:1px solid #2b3d54;box-shadow:inset 0 1px rgba(255,255,255,.04),0 2px 4px rgba(0,0,0,.3);color:#dce7f5;font-size:11px;white-space:nowrap}
.detail{margin-top:11px;padding-top:10px;border-top:1px solid #1b293b;color:#b7c4d4;font-size:12px;line-height:1.7;white-space:pre-line}
.detail b{color:#dce8f5}
.note{margin-top:20px;padding:16px 18px;border:1px solid #173b58;background:#0a1625;border-radius:14px;color:#a8b9cb;line-height:1.6;font-size:13px}
.nav{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:30;display:flex;gap:8px;align-items:center;padding:8px;background:rgba(4,8,14,.9);backdrop-filter:blur(18px);border:1px solid #20344c;border-radius:18px;box-shadow:var(--shadow)}
.nav button{border:1px solid #29415c;background:#0d1725;color:#dce8f5;border-radius:11px;padding:10px 14px;cursor:pointer}
.nav button:hover{border-color:var(--accent);color:#fff}
.nav .jump{min-width:72px;text-align:center;color:#9eb0c5;font-size:12px}
.category-nav{max-width:1180px;margin:0 auto;padding:10px 18px 0}
.toc{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 8px}
.toc button{background:#0b1421;color:#8fa4ba;border:1px solid #1a2a3d;border-radius:999px;padding:8px 11px;font-size:11px;cursor:pointer;transition:background .15s,border-color .15s}
.toc button:hover,.toc button:focus-visible{border-color:var(--accent);color:#fff;outline:none}
.toc button.active{color:#fff;border-color:var(--accent);background:#0b1c2e}
.mobile-category{display:none;width:100%;background:#0b1421;color:var(--text);border:1px solid #29415c;border-radius:12px;padding:12px;font:inherit}
@media(max-width:760px){
 .category-nav{padding:10px 12px 0}
 .toc{display:none}
 .mobile-category{display:block}
}
.hidden{display:none!important}
@media(max-width:760px){
 .topbar{padding:11px 12px} .brand{font-size:12px} .counter{display:none}
 .main{padding:18px 12px 100px} .grid{grid-template-columns:1fr}
 .hero,.slide{min-height:calc(100vh - 80px)}
 .section-head{display:block} .section-head p{margin-top:10px}
 .keys{max-width:50%} .nav{width:calc(100% - 24px);justify-content:space-between}
 .nav button{padding:9px 11px}
}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="brand">SHORTCUT <span>SERIES</span></div>
  <div class="search"><input id="search" aria-label="Search shortcuts" placeholder="Search pages, shortcuts or actions…"></div>
  <div class="counter" id="counter">00 / 09</div>
</header>
<div class="category-nav"><div class="toc" id="toc" aria-label="Jump to category"></div><select class="mobile-category" id="mobileCategory" aria-label="Jump to category"><option value="0">Choose a category…</option></select></div>
<main class="main" id="main"></main>
<nav class="nav">
  <button onclick="go(-1)">← Previous</button>
  <div class="jump" id="jump">0 / 9</div>
  <button onclick="go(1)">Next →</button>
</nav>
</div>

,["Ctrl + Esc","Open Start","Open the Windows Start menu."],["Win + ,","Peek at Desktop","Temporarily peek at the desktop while holding the keys on supported Windows versions."],["Win + Shift + Up","Stretch Window Vertically","Stretch the active desktop window vertically where supported."],["Win + Shift + Down","Restore / Minimize Window","Restore or minimize the active window where supported."],["Win + Ctrl + F","Search for PCs (legacy)","A legacy search-for-computers shortcut that may be unavailable on current Windows configurations."],["Win + Shift + S","Screen Snipping","Open the Windows screen-snipping overlay to capture a selected area."],["Win + Alt + R","Start / Stop Recording (Xbox Game Bar)","Start or stop a recording in Xbox Game Bar when recording is supported and enabled."]]},{"n":3,"title":"Files, Folders & System Tools","subtitle":"Manage files, troubleshoot Windows, run built-in tools, and find system controls.","rows":[["Win + E","Open File Explorer","Open File Explorer instantly."],["Ctrl + N","New Window","Open a new File Explorer window."],["Ctrl + Shift + N","New Folder","Create a new folder in the current location."],["F2","Rename","Rename the selected file or folder."],["Delete","Delete","Move the selected item to the Recycle Bin."],["Shift + Delete","Permanent Delete","Delete the selected item without sending it to the Recycle Bin."],["Alt + Enter","Properties","Open properties for the selected item."],["Ctrl + A","Select All","Select all items in the current folder."],["Alt + Left","Back","Go to the previous location."],["Alt + Right","Forward","Go to the next location."],["Alt + Up","Go Up","Move one level up in the folder hierarchy."],["Ctrl + F","Search","Search within the current folder."],["F5","Refresh","Refresh the current folder view."],["Ctrl + Shift + Esc","Task Manager","Open Task Manager directly."],["Ctrl + Alt + Delete","Security Options","Open the Windows security options screen."],["Win + X","Power User Menu","Open the advanced Windows quick-access menu."],["Win + R","Run Dialog","Open the Run dialog."],["Win + Pause","System Information","View basic information about the PC."],["Alt + F4","Shut Down / Restart","Open Windows shutdown options from the desktop."],["Ctrl + Click","Select Individual Items","Select multiple non-contiguous items individually."],["Shift + Click","Select Range","Select a continuous range of items."],["Ctrl + X","Cut","Cut selected items."],["Ctrl + C","Copy","Copy selected items."],["Ctrl + V","Paste","Paste items into the destination."],["Ctrl + X → Ctrl + V","Move","Cut and paste items to move them."],["Win + L","Lock PC","Lock your PC immediately."],["Win + I","Settings","Open Windows Settings; use Windows Security from Start or Settings for security controls."],["File or folder > Properties > Advanced","Encrypt with EFS (supported configurations)","Where supported, open Properties > Advanced and select Encrypt contents to secure data. This is a menu workflow, not a keyboard shortcut; availability depends on Windows edition and filesystem."],["Win + V","Clipboard History","View and clear clipboard data."],["Win + Ctrl + O","On-Screen Keyboard","Open or close the On-Screen Keyboard; Narrator is Win + Ctrl + Enter."],["Win + A","Quick Settings / Action Center","Windows 11 opens Quick Settings; Windows 10 opens Action Center."],["Win + Alt + K","Microphone Mute (supported apps)","In supported apps and Windows versions, toggle microphone mute. It is not a universal system-wide microphone switch."],["Settings > Accounts > Sign-in options","Configure Windows Hello","Set up Windows Hello from Settings. “Win + Hello” is not a keyboard shortcut."],["Win + B","Focus System Tray","Move keyboard focus to the notification area; it is not a battery-saver toggle."],["Settings > System > Power & battery","Power Mode (menu path)","Open Windows Settings and choose Power & battery to change power mode; this is a menu path, not a keyboard shortcut."],["Win + K","Wireless Display","Open wireless display/audio connection controls."],["Manufacturer-specific Fn key","Fan / Performance Mode","Some laptops provide a manufacturer-defined Fn-key combination for fan or performance modes. The exact key varies by model; check the laptop manual or vendor utility."],["Task Manager > Run new task","Run New Task (menu path)","In Task Manager, choose Run new task. This is a menu path, not a standalone keyboard shortcut."],["Start > Power > Sleep","Sleep (menu path)","Use the Start menu power controls to put the PC to sleep; exact options vary by device and power settings."],["Start > Power > Hibernate","Hibernate (if enabled)","Use the Windows power menu if hibernation is enabled. The option may be hidden or unavailable on some devices."],["Start > Power > Restart","Restart Windows","Use Start > Power > Restart. Win + X letter sequences vary by Windows version and display language."],["Manufacturer-specific Fn key","Airplane Mode (hardware-dependent)","Some laptops map an Fn-key combination to airplane mode; the exact key depends on the model. Windows Quick Settings is an alternative."],["Manufacturer-specific Fn key","Keyboard Backlight (hardware-dependent)","Some laptops use an Fn-key combination to toggle keyboard backlighting; the exact key depends on the model."],["Win + Up","Maximize Window","Maximize the active window."],["Win + Down","Minimize Window","Minimize the active window."],["Win + Left","Snap Window Left","Snap the window left."],["Win + Right","Snap Window Right","Snap the window right."],["Settings > System > Storage","Storage Sense (menu path)","Open Storage settings to configure Storage Sense; Win + S opens Windows Search, not Storage Sense."],["Win + Shift + S","Snipping Tool","Take a screenshot of any area."],["Win + W","Widgets","Open the Windows Widgets board; it does not launch Sticky Notes."],["Win + +","Magnifier","Zoom in anywhere on the screen."],["Win + H","Voice Typing","Start voice typing in a text field; it is not a voic y Keys."],["Right Shift × 8","Filter Keys","Press Right Shift eight times to toggle Filter Keys."],["Win + Ctrl + C","Color Filters","Toggle Windows color filters."],["Win + Ctrl + N","Narrator Settings","Open Narrator settings; this does not toggle Night Light."],["Win + + / Win + -","Magnifier Zoom","Use Windows Magnifier to zoom in or out; this does not change system-wide text size."],["Win + Ctrl + Shift + B","Wake Display","Use when a Windows device has a blank or black screen; the screen may briefly flicker. It is not a general graphics-driver reset."],["Win + Ctrl + O","On-Screen Keyboard","Open or close the On-Screen Keyboard; Narrator uses Win + Ctrl + Enter."],["Win + Esc","Close Magnifier","Exit Windows Magnifier."],["Ctrl + Alt + I","Magnifier Invert Colors","Invert screen colors while Magnifier is running."],["Win + Ctrl + M","Magnifier Settings","Open Magnifier settings on supported Windows versions."],["Win + Ctrl + C","Color Filters (if enabled)","Toggle color filters when the Windows accessibility shortcut is enabled."],["Win + Ctrl + S","Speech Recognition (version-dependent)","On Windows versions that support it, this may start speech recognition; availability differs by release."],["PrtSc","Screenshot (device-dependent)","Capture the screen or open a capture interface depending on Windows settings and device configuration."]]},{"n":5,"title":"Web Browsers","subtitle":"Navigate tabs and pages, manage bookmarks and privacy, and inspect websites in Chrome and Edge.","rows":[["Ctrl + T","New Tab","Open a new browser tab."],["Ctrl + Shift + T","Reopen Closed Tab","Restore the most recently closed tab; repeat to reopen earlier closed tabs."],["Ctrl + W","Close Tab","Close the current browser tab."],["Ctrl + Tab","Next Tab","Move to the next open tab."],["Ctrl + Shift + Tab","Previous Tab","Move to the previous open tab."],["Ctrl + 1–8","Specific Tab","Jump to a tab by its position, counting from the left."],["Ctrl + 9","Last Tab","Jump to the last tab. const notes = {"1":"Start here. These commands form the foundation for editing and navigating in many desktop apps.","2":"Windows shortcuts can depend on the Windows release; version differences are called out where important.","3":"File Explorer shortcuts are grouped here. Run commands and Settings/menu workflows are listed in Reference & Compatibility, not counted as keyboard shortcuts.","4":"Accessibility and capture behavior can depend on Windows version, language and device configuration.","5":"Shared browser shortcuts are grouped together; Chrome- and Edge-specific behavior is labeled.","6":"Word and Office shortcuts can differ between desktop, web and mobile versions. Version-dependent formatting shortcuts are labeled; consult the official Word reference when behavior differs.","7":"Excel and PowerPoint shortcuts are scoped to their respective applications.","8":"VS Code uses default keybindings that can be customized. Laptop Fn keys depend on the exact model.","9":"Run commands, menu paths, and compatibility caveats are reference workflows rather than keyboard shortcuts. Official references: Microsoft Windows and Office support, Google Chrome Help, and VS Code documentation."};
let current = 0;
let filtered = null;

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function keyHtml(keys) {
  return keys.split(/\s*\+\s*/).map(k=>`<span class="key">${escapeHtml(k)}</span>`).join('<span style="color:#4bbcff;padding:0 2px">+</span>');
}
function explanation(row, page) {
  const [keys, name, action] = row;

  const examples = {
    "Copy": "Select text or a file, press the shortcut, then paste it somewhere else to create a copy.",
    "Cut": "Select text or a file, cut it, open the destination, then paste it to move it.",
    "Paste": "Copy or cut content first, place the cursor or open the destination, then paste.",
    "Undo": "If you remove a paragraph by mistake, undo to restore the previous state.",
    "Redo": "After undoing a change, redo to apply that change again.",
    "Select All": "In a document, use the shortcut to select all text before changing its formatting.",
    "Save": "After editing a document, save it to keep the latest changes.",
    "Save As": "Save a copy with a new filename when you want to keep the original unchanged.",
    "Find / Search": "Search for a word in a long document to jump directly to its occurrence.",
    "Start Menu": "Open Start to search for an app such as Calculator.",
    "Show / Hide Desktop": "Reveal a file on the desktop, then use the shortcut again to return to your open windows.",
    "File Explorer": "Open a folder to browse files, create folders, or move items.",
    "Settings": "Open Settings to change Wi-Fi, display, Bluetooth, or personalization options.",
    "Lock Laptop": "Lock the computer before stepping away; sign in again to continue.",
    "Run": "Open Run, enter a known command such as notepad, then press Enter.",
    "Clipboard History": "Open clipboard history and select an earlier copied item to paste it.",
    "Screenshot": "Select the part of the screen you want to capture, then paste the image into a document.",
    "Developer Tools": "Open a website, launch developer tools, and inspect an element to see its HTML and CSS.",
    "Bookmark Manager": "Open the bookmark manager to find, organize, or delete saved pages.",
    "Clear Browsing Data": "Choose a time range and data types, then confirm only the items you intend to remove.",
    "Private Browsing Window": "Open a private window when you do not want that session's browsing history saved in the normal history.",
    "Bookmarks Bar": "Show the bookmarks bar to access saved websites without opening the bookmarks menu.",
    "New Tab": "Open another tab to keep a second website available without closing the current page.",
    "Close Tab": "Close the tab you have finished using while leaving the other tabs open.",
    "Next Tab": "Move to the next tab when several pages are open.",
    "Previous Tab": "Return to the tab immediately before the current one.",
    "Bookmark Page": "Save the current website as a bookmark so you can return to it later.",
    "Downloads": "Open downloads to find a file you just downloaded.",
    "Find on Page": "Search for a name or phrase on the current page instead of reading everything.",
    "Zoom In": "Increase the page size when text or controls are too small to read.",
    "Zoom Out": "Reduce page size to fit more content on the screen.",
    "Reset Zoom": "Return the page to its default zoom after changing its size.",
    "Homepage": "Open the home page configured in the browser settings.",
    "Go Back": "Return to the page you visited immediately before the current one.",
    "Go Forward": "After going back, move forward to the page you had been viewing.",
    "New Window": "Open a separate browser window to keep a different set of tabs apart.",
    "Print Page": "Open the print dialog to print the page or save it as a PDF.",
    "View Page Source": "Open the page source to inspect the HTML sent by the website.",
    "Bookmark All Tabs": "Save a group of open tabs into a bookmark folder where the browser supports it.",
    "Hard Refresh": "Reload a page when it appears to be showing stale cached content.",
    "Reload Page": "Reload the current page after a site has changed or failed to finish loading.",
    "Full Screen": "Use full screen to give the web page more screen space, then exit when finished."
  };

  let example = examples[name];
  if (!example) {
    const cleanAction = action.replace(/[.!]$/, "");
    example = "For example, while using the relevant app, press " + keys + " to " + cleanAction.charAt(0).toLowerCase() + cleanAction.slice(1) + ".";
  }

  return [
    "What it does: " + action,
    "Example: " + example
  ].join("\n");
}
function renderCategoryNav(){
  const toc=document.getElementById('toc');
  const select=document.getElementById('mobileCategory');
  toc.innerHTML=pages.map(p=>`<button type="button" class="${current===p.n&&!filtered?'active':''}" aria-current="${current===p.n&&!filtered?'page':'false'}" onclick="goToCategory(${p.n})">${escapeHtml(p.title)}</button>`).join('');
  select.innerHTML='<option value="0">Choose a category…</option>'+pages.map(p=>`<option value="${p.n}" ${current===p.n&&!filtered?'selected':''}>${escapeHtml(p.title)}</option>`).join('');
}
function goToCategory(pageNumber){
  filtered=null;
  current=pageNumber;
  document.getElementById('search').value='';
  render();
}
document.getElementById('mobileCategory').addEventListener('change',e=>{
  if(Number(e.target.value)>0) goToCategory(Number(e.target.value));
});
function render(){
  renderCategoryNav();
  const main = document.getElementById('main');
  if(filtered !== null){
    main.innerHTML = `<section class="slide">
      <div class="section-head"><div><div class="kicker">Search results</div><h2>${filtered.length} matching <span>shortcuts</span></h2></div></div>
      ${filtered.length ? `<div class="grid">${filtered.map(x=>cardHtml(x.row,x.page)).join('')}</div>` : `<div class="note" role="status">No matching shortcuts found. Try a different keyword or key combination.</div>`}
    </section>`;
    return;
  }
  if(current===0){
    const p=pages[0];
    main.innerHTML = `<section class="hero">
      <div class="kicker">Ultimate Reference Guide</div>
      <h1>Laptop Shortcut Series</h1>
      <div class="lead">A searchable keyboard reference organized into 9 practical categories. Learn the key, the command, what it does, and when to use it.</div>
      <div class="pills"><span class="pill">Windows 10 / 11</span><span class="pill">Productivity</span><span class="pill">Browser</span><span class="pill">Office</span><span class="pill">Coding</span></div>
      <div class="note"><b>How to use it:</b> choose a category from the navigation above, or use <b>← / →</b> and the Previous / Next buttons below. Search finds shortcuts across the entire guide.</div>
    </section>`;
  } else {
    const p=pages[current-1];
    main.innerHTML = `<section class="slide">
      <div class="section-head">
        <div><div class="kicker">Category ${String(p.n).padStart(2,'0')} / ${pages.length}</div><h2>${escapeHtml(p.title.split(' ')[0])} <span>${escapeHtml(p.title.split(' ').slice(1).join(' '))}</span></h2></div>
        <div class="meta">${p.rows.length} shortcuts</div>
      </div>
      <p class="lead">${escapeHtml(p.subtitle)}</p>
      <div class="progress"><i style="width:${p.n/pages.length*100}%"></i></div>
      <div class="grid">${p.rows.map(r=>cardHtml(r,p)).join('')}</div>
      <div class="note"><b>Page focus:</b> ${escapeHtml(notes[p.n] || '')}</div>
    </section>`;
  }
  document.getElementById('counter').textContent = String(current).padStart(2,'0') + ' / ' + String(pages.length).padStart(2,'0');
  document.getElementById('jump').textContent = current+' / '+pages.length;
  window.scrollTo({top:0,behavior:'smooth'});
}
function cardHtml(row,page){
  const [keys,name,action]=row;
  return `<article class="card">
    <div class="card-top">
      <div><h3>${escapeHtml(name)}</h3><p>${escapeHtml(action)}</p></div>
      <div class="keys">${keyHtml(keys)}</div>
    </div>
    <div class="detail"><b>Detailed explanation:</b> ${escapeHtml(explanation(row,page))}</div>
  </article>`;
}
function go(delta){
  filtered=null;
  current=Math.max(0,Math.min(pages.length,current+delta));
  document.getElementById('search').value='';
  render();
}
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT') return;
  if(e.key==='ArrowRight') go(1);
  if(e.key==='ArrowLeft') go(-1);
  if(e.key==='Home'){current=0;render();}
  if(e.key==='End'){current=pages.length;render();}
});
document.getElementById('search').addEventListener('input',e=>{
  const q=e.target.value.trim().toLowerCase();
  if(!q){filtered=null;render();return;}
  filtered=[];
  pages.forEach(p=>p.rows.forEach(row=>{
    const hay=(p.title+' '+row.join(' ')).toLowerCase();
    if(hay.includes(q)) filtered.push({row,page:p});
  }));
  render();
});
render();
</script>
</body>
</html>
